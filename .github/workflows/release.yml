#
# Release (facdrone-data-manager 3.6 and 5.1, requirements 8.5 and 9.4): on a `vX.Y.Z` tag it
# runs the CI gates, checks that the tag names the version of both distributions
# (facdrone-data and facdrone-data-types, lockstep versions), builds the wheel and the sdist of
# each, installs the wheels into a fresh environment, takes the tag's section of CHANGELOG.md
# and creates the GitHub release for the tag: the two wheels and the two sdists attached, the
# changelog section as its notes. Nothing goes to a package index and no workflow artifact is
# uploaded. `workflow_dispatch` is a build check: the same build and smoke steps, nothing
# published. Inert in the workspace like ci.yml: GitHub reads it once it is at the repository root.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # a build check without a tag; the version check and the release are skipped

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    name: build the wheels and sdists, release them on a tag
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release step creates the GitHub release; only this job may write, and only that
    # step is handed the token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The build steps run third-party build backends; they get no credential in .git.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: The tag names the version of both distributions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for project in pyproject.toml types/pyproject.toml; do
            version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$project")"
            if [ "$version" != "$tag" ]; then
              echo "::error file=$project::version $version differs from the tag v$tag (lockstep versions)"
              exit 1
            fi
          done
      - name: Build both distributions
        # --no-sources: the workspace source of facdrone-data-types does not exist outside
        # the workspace; the wheel's metadata names the distribution and its version only.
        run: |
          uv build --no-sources --out-dir dist types
          uv build --no-sources --out-dir dist .
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 2
          test "$(ls dist/*.tar.gz | wc -l)" -eq 2
      - name: The wheels install into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.13
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install --no-sources dist/*.whl
          "$RUNNER_TEMP/smoke/bin/facdrone-data" --help
          "$RUNNER_TEMP/smoke/bin/python" -c "import facdrone_data.migrate, facdrone_data_types"
      - name: The installed wheel migrates an embedded database
        # The chain ships as package data; `db upgrade` from the wheel proves it is complete.
        # pgembed comes with the `testing` extra's version; no other database is reached.
        working-directory: ${{ runner.temp }}
        run: |
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install "pgembed==0.2.0"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          from facdrone_data.testing.pg_server import start

          server = start()
          try:
              script = Path(sys.executable).with_name("facdrone-data")
              env = {**os.environ, "FACDRONE_DATA_DSN": server.dsn}
              for args in (["db", "upgrade"], ["db", "current"], ["db", "check"]):
                  run = subprocess.run(
                      [str(script), *args], env=env, capture_output=True, text=True, check=True
                  )
                  print(" ".join(args), "->", run.stdout.strip())
          finally:
              server.stop()
          PY
      - name: Release notes from CHANGELOG.md
        # The body of the `## [X.Y.Z]` section, its heading left out (the release names the
        # tag). On a tag the section must exist and say something; without a tag the
        # `Unreleased` section is printed and may be empty.
        run: |
          section="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) section="Unreleased" ;; esac
          awk -v want="## [$section]" '
            /^## / && inside { inside = 0; done = 1 }
            /^## / && !done && index($0, want) == 1 { inside = 1; found = 1; next }
            inside { print }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" \
            || { echo "::error file=CHANGELOG.md::no section [$section]"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"
          case "$GITHUB_REF" in
            refs/tags/v*)
              grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
                || { echo "::error file=CHANGELOG.md::section [$section] is empty"; exit 1; }
              ;;
          esac
          sha256sum dist/*.whl dist/*.tar.gz
      - name: Create the GitHub release (the four files, the changelog section as notes)
        # Tags only: a dispatch and the local runner (kit/ci_local.py) skip this step.
        # --verify-tag refuses to create a tag that was not pushed.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "facdrone-data ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.whl dist/*.tar.gz
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 4
